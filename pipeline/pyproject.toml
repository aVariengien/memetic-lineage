[project]
name = "pipeline"
version = "0.1.0"
description = "Memetic lineage strand processing pipeline"
requires-python = ">=3.11"
dependencies = [
    "diskcache>=5.6",
    "groq>=0.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.0",
    "pandas>=2.1",
    "pydantic>=2.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "umap-learn>=0.5",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
